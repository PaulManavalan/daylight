name: Validate Daylight

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/New_York
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify domain and recovery behavior
        run: pnpm test
      - name: Build the local-server application
        run: pnpm exec next build --webpack
      - name: Type-check the complete application
        run: pnpm typecheck
      - name: Verify localhost API origin isolation
        run: node tests/local-api.cjs
      - name: Build the hosted browser application
        run: pnpm run build:hosted
      - name: Check production dependency advisories
        run: pnpm audit --prod
